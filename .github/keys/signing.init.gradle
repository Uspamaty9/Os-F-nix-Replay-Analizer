// Fuerza la llave de firma fija del repositorio en los APK de depuración.
allprojects {
    afterEvaluate { p ->
        if (p.plugins.hasPlugin('com.android.application') && System.getenv('FENIX_KEYSTORE')) {
            p.android.signingConfigs.debug {
                storeFile = new File(System.getenv('FENIX_KEYSTORE'))
                storePassword = 'android'
                keyAlias = 'androiddebugkey'
                keyPassword = 'android'
            }
        }
    }
}
