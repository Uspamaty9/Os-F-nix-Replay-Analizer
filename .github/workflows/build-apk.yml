name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar SDK de Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - name: Llave de firma fija (para poder actualizar la app)
        run: |
          mkdir -p ~/.android
          cp .github/keys/debug.keystore ~/.android/debug.keystore
      - name: Compilar cada ZIP
        run: |
          export CI=false
          ROOT="$PWD"
          mkdir -p out
          trap 'echo "ERR linea $LINENO: $BASH_COMMAND" >> "$ROOT/out/report.txt"' ERR
          export FENIX_KEYSTORE="$ROOT/.github/keys/debug.keystore"
          mkdir -p out
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright-core@1.48 > /dev/null 2>&1 || true
          for z in ./*.zip; do
            n=$(basename "$z" .zip)
            echo "=== $n ===" | tee -a out/report.txt
            rm -rf work && mkdir work
            unzip -q "$z" -d work
            S=$(find work -name settings.gradle -not -path '*/node_modules/*' | head -1)
            P=$(find work -name package.json -not -path '*/node_modules/*' | head -1)
            if [ -n "$S" ]; then
              echo "Proyecto Android" | tee -a out/report.txt
              (cd "$(dirname "$S")" && gradle -I "$ROOT/.github/keys/signing.init.gradle" assembleDebug --stacktrace) || { echo "FALLO gradle $n" | tee -a out/report.txt; continue; }
              cp "$(find work -name app-debug.apk | head -1)" "out/$n.apk"
            elif [ -n "$P" ]; then
              echo "Proyecto web (React): se envuelve con Capacitor" | tee -a out/report.txt
              cd "$(dirname "$P")"
              # Recursos que la app original descarga de internet: se empaquetan dentro de la app
              mkdir -p public/offline/tiles
              get() { out="$1"; shift; for u in "$@"; do if curl -fsSL --retry 3 -m 180 -o "$out" "$u" && [ -s "$out" ]; then echo "OK $out <- $u" | tee -a "$ROOT/out/report.txt"; return 0; fi; done; echo "NO SE PUDO DESCARGAR $out" | tee -a "$ROOT/out/report.txt"; rm -f "$out"; return 1; }
              get public/offline/res.dat https://kpias760.github.io/haxball-replay-analyzer.github.io/pliki/res.dat https://haxball-replay-analyzer.github.io/pliki/res.dat https://www.haxball.com/res.dat || true
              get public/offline/geo.json https://kpias760.github.io/haxball-replay-analyzer.github.io/pliki/geo.json https://haxball-replay-analyzer.github.io/pliki/geo.json || true
              get public/offline/host.json https://kpias760.github.io/haxball-replay-analyzer.github.io/pliki/host.json || true
              echo '{"content":""}' > public/offline/notice.json
              for t in grass hockey; do
                get "public/offline/tiles/${t}tile.png" "https://raw.githubusercontent.com/haxball-stadium-editor/haxball-stadium-editor.github.io/v2.11/${t}tile.png" || true
              done
              npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tail -3 | tee -a "$ROOT/out/report.txt"
              # Fuentes locales (sin Google Fonts)
              npm install --no-save --legacy-peer-deps --no-audit --no-fund @fontsource/open-sans@5 @fontsource/roboto@5 @fontsource/oswald@5 @fontsource/poppins@5 material-icons@1 2>&1 | tail -2
              mkdir -p public/fonts
              cp node_modules/@fontsource/open-sans/files/open-sans-latin-{400,600,700}-normal.woff2 public/fonts/
              cp node_modules/@fontsource/roboto/files/roboto-latin-{300,400,700}-normal.woff2 public/fonts/
              cp node_modules/@fontsource/oswald/files/oswald-latin-{500,600,700}-normal.woff2 public/fonts/
              cp node_modules/@fontsource/poppins/files/poppins-latin-{400,500,600,700}-normal.woff2 public/fonts/
              cp node_modules/material-icons/iconfont/material-icons.woff2 public/fonts/
              { for w in 400 600 700; do echo "@font-face{font-family:'Open Sans';font-weight:$w;font-display:swap;src:url(open-sans-latin-$w-normal.woff2) format('woff2')}"; done
                for w in 500 600 700; do echo "@font-face{font-family:'Oswald';font-weight:$w;font-display:swap;src:url(oswald-latin-$w-normal.woff2) format('woff2')}"; done
                for w in 400 500 600 700; do echo "@font-face{font-family:'Poppins';font-weight:$w;font-display:swap;src:url(poppins-latin-$w-normal.woff2) format('woff2')}"; done
                for w in 300 400 700; do echo "@font-face{font-family:'Roboto';font-weight:$w;font-display:swap;src:url(roboto-latin-$w-normal.woff2) format('woff2')}"; done
                echo "@font-face{font-family:'Material Icons';font-style:normal;font-weight:400;src:url(material-icons.woff2) format('woff2')}"; } > public/fonts/fonts.css
              ls public/fonts | tee -a "$ROOT/out/report.txt"
              GENERATE_SOURCEMAP=false npm run build > "$ROOT/build.log" 2>&1 && BST=0 || BST=$?
              tail -15 "$ROOT/build.log" | tee -a "$ROOT/out/report.txt"
              [ $BST -eq 0 ] || { echo "FALLO npm build $n" | tee -a "$ROOT/out/report.txt"; cd "$ROOT"; continue; }
              # Prueba en navegador real (viewport de celular)
              (cd build && python3 -m http.server 8123 > /dev/null 2>&1 &) ; sleep 2
              NODE_PATH="$RUNNER_TEMP/pw/node_modules" node "$ROOT/.github/scripts/verify-web.cjs" http://localhost:8123/ "$ROOT/out" "$ROOT/tests" 2>&1 | tail -60 | tee -a "$ROOT/out/report.txt"
              pkill -f "http.server 8123" || true
              npm install --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 2>&1 | tail -2
              printf '%s' '{"appId":"com.osfenix.replayanalyzer.motor","appName":"Replay Analyzer Os Fênix","webDir":"build","backgroundColor":"#111111","android":{"backgroundColor":"#111111"}}' > capacitor.config.json
              npx cap add android
              # La v4 (Centro de análisis + Pizarra táctica) es OTRA app: otro id y otro nombre, para instalarse junto a la anterior sin "actualizarla"
              APPNAME="Replay Analyzer Os Fênix"
              case "$n" in *v4-Scouting*) APPNAME="Tactical Analyzer"; sed -i 's/applicationId "[^"]*"/applicationId "com.osfenix.fenixpro"/' android/app/build.gradle; grep -n 'applicationId\|namespace' android/app/build.gradle | tee -a "$ROOT/out/report.txt";; esac
              sed -i 's/versionCode [0-9]*/versionCode 1/; s/versionName "[^"]*"/versionName "1.0"/' android/app/build.gradle
              # Icono de la app: la imagen entregada por el club
              RES=android/app/src/main/res
              if [ -f android-native/make_icons.py ] && [ -f public/brand/app.png ]; then
                rm -rf "$RES/mipmap-anydpi-v26"
                pip install --quiet --break-system-packages pillow 2>&1 | tail -1
                python3 android-native/make_icons.py public/brand/app.png "$RES" 2>&1 | tee -a "$ROOT/out/report.txt"
                # Plugin nativo: lista automaticamente los .hbr2 del celular
                PKGDIR=android/app/src/main/java/com/osfenix/replayanalyzer/motor
                mkdir -p "$PKGDIR"
                cp android-native/HbrScanner.java android-native/MainActivity.java "$PKGDIR/"
                echo "Icono y plugin HbrScanner aplicados" | tee -a "$ROOT/out/report.txt"
              fi
              sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">'"$APPNAME"'</string>|; s|<string name="title_activity_main">[^<]*</string>|<string name="title_activity_main">'"$APPNAME"'</string>|' "$RES/values/strings.xml"
              # Tema: usar tambien la zona de la camara (recorte) en pantalla completa
              STY="$RES/values/styles.xml"
              if [ -f "$STY" ]; then
                sed -i 's|\(<style name="AppTheme.NoActionBar"[^>]*>\)|\1\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>|' "$STY"
                echo "--- styles.xml ---" | tee -a "$ROOT/out/report.txt"; cat "$STY" | tee -a "$ROOT/out/report.txt"
              fi
              # Permiso para listar solo los archivos .hbr2 del celular
              MAN="android/app/src/main/AndroidManifest.xml"
              if [ -f "$MAN" ] && ! grep -q MANAGE_EXTERNAL_STORAGE "$MAN"; then
                sed -i 's|<application|<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <application|' "$MAN"
                echo "--- manifest ---" | tee -a "$ROOT/out/report.txt"; grep -n "uses-permission" "$MAN" | tee -a "$ROOT/out/report.txt"
              fi
              if [ -f "$MAN" ] && ! grep -q 'permission.VIBRATE' "$MAN"; then
                sed -i 's|<application|<uses-permission android:name="android.permission.VIBRATE" />\n    <application|' "$MAN"
              fi
              npx cap sync android
              (cd android && gradle -I "$ROOT/.github/keys/signing.init.gradle" assembleDebug --stacktrace) || { echo "FALLO gradle capacitor $n" | tee -a "$ROOT/out/report.txt"; cd "$ROOT"; continue; }
              cp android/app/build/outputs/apk/debug/app-debug.apk "$ROOT/out/$n.apk"
              cd "$ROOT"
            else
              echo "Sin proyecto reconocible: $z" | tee -a out/report.txt
            fi
          done
          ls -la out
      - name: Guardar resultados en la rama apks
        if: always()
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/res"
          cp out/* "$RUNNER_TEMP/res/" 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apks
          git rm -rf -q .
          git clean -fdxq
          cp "$RUNNER_TEMP"/res/* . 2>/dev/null || true
          for g in '*.apk' '*.txt' '*.png'; do git add -f -- "$g" 2>/dev/null || true; done
          git commit -q -m "Resultados de compilación" || true
          git status --short | head -5 > "$RUNNER_TEMP/st.txt"
          git push --force origin apks 2> "$RUNNER_TEMP/push.err"; RC=$?
          echo "::error::PUSH rc=$RC $(tr '\n' ' ' < "$RUNNER_TEMP/push.err" | head -c 600) STATUS $(tr '\n' ' ' < "$RUNNER_TEMP/st.txt") REPORT $(tail -6 "$RUNNER_TEMP/res/report.txt" | tr '\n' ' ' | head -c 700)"
          exit $RC
