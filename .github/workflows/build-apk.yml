name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar SDK de Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - name: Compilar cada ZIP
        run: |
          set -e
          export CI=false
          ROOT="$PWD"
          mkdir -p out
          for z in ./*.zip; do
            n=$(basename "$z" .zip)
            echo "=== $n ==="
            rm -rf work && mkdir work
            unzip -q "$z" -d work
            S=$(find work -name settings.gradle -not -path '*/node_modules/*' | head -1)
            P=$(find work -name package.json -not -path '*/node_modules/*' | head -1)
            if [ -n "$S" ]; then
              echo "Proyecto Android"
              (cd "$(dirname "$S")" && gradle assembleDebug --stacktrace)
              cp "$(find work -name app-debug.apk | head -1)" "out/$n.apk"
            elif [ -n "$P" ]; then
              echo "Proyecto web (React): se envuelve con Capacitor"
              cd "$(dirname "$P")"
              npm ci --legacy-peer-deps || npm install --legacy-peer-deps
              npm run build
              npm install --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
              npx cap init "Os Fenix Replay Analyzer" com.osfenix.replayanalyzer --web-dir build
              npx cap add android
              npx cap sync android
              (cd android && gradle assembleDebug --stacktrace)
              cp android/app/build/outputs/apk/debug/app-debug.apk "$ROOT/out/$n.apk"
              cd "$ROOT"
            else
              echo "Sin proyecto reconocible: $z"
            fi
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: out/*.apk
      - name: Guardar APK en la rama apks
        run: |
          mkdir -p "$RUNNER_TEMP/apks"
          cp out/*.apk "$RUNNER_TEMP/apks/"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apks
          git rm -rf -q .
          git clean -fdq
          cp "$RUNNER_TEMP"/apks/*.apk .
          git add *.apk
          git commit -q -m "APK compilados"
          git push --force origin apks
