name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar SDK de Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar cada ZIP
        run: |
          mkdir -p out
          for z in ./*.zip; do
            n=$(basename "$z" .zip)
            rm -rf work && mkdir work
            unzip -q "$z" -d work
            S=$(find work -name settings.gradle | head -1)
            if [ -z "$S" ]; then echo "Sin proyecto Android: $z"; continue; fi
            (cd "$(dirname "$S")" && gradle assembleDebug --stacktrace)
            cp "$(find work -name app-debug.apk | head -1)" "out/$n.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: out/*.apk
