name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Descomprimir y compilar
        run: |
          unzip -q ./*.zip -d proj
          DIR=$(dirname "$(find proj -name settings.gradle | head -1)")
          cd "$DIR"
          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Os-Fenix-Replay-Analyzer-APK
          path: proj/**/app-debug.apk
